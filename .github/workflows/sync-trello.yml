name: Sync Trello Town Hall

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Trello sync
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: node sync-trello.js

      - name: Commit updated data if changed
        run: |
          git config user.name "schedule-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/townhall.json
          git diff --staged --quiet && echo "No changes, skipping commit." || (
            git commit -m "Sync Town Hall data [automated]" &&
            git pull --rebase origin main &&
            git push
          )
